packages:
  - apps/*
  - packages/*

# Supply-chain care. Docent ships via npx, so what we install matters.
# Refuse versions published less than a day ago: most malicious releases are
# caught and pulled within hours.
minimumReleaseAge: 1440
# Install scripts are off unless a package is listed here.
onlyBuiltDependencies:
  - lefthook
# Tree-sitter grammars ship a native Node binding built by an install script.
# Docent only loads their prebuilt WASM files and queries, so the script never runs.
ignoredBuiltDependencies:
  - tree-sitter-go
  - tree-sitter-javascript
  - tree-sitter-python
  - tree-sitter-typescript
